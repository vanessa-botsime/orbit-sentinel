# Sentinel's own database. Kafka comes from the orbit-graduate-system stack (localhost:9092).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - sentineldata:/var/lib/postgresql/data

volumes:
  sentineldata:
